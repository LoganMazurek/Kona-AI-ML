# The landing page for loganmazurek.com (formerly the `router` container) is now
# served as static HTML directly by nginx — see deploy/nginx/router.conf. That
# removes a ~57 MB gunicorn process from this 1 GB droplet. router_app.py /
# wsgi_router.py are kept for local use (gunicorn wsgi_router:app) but are no
# longer deployed.
services:
  kona-ml:
    build: .
    container_name: kona-ml
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      FLASK_ENV: "production"
      # Read from the .env file next to this compose file -- never hardcode it
      # here, since anyone who can read the key can forge a session for any
      # franchise. The `:?` form aborts `docker compose up` when it is unset,
      # so a missing key fails the deploy instead of starting an app whose
      # sessions can be forged. See README "Rotating SECRET_KEY".
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env - see README}"
      SESSION_COOKIE_SECURE: "true"
    volumes:
      - ./source/franchise_data.db:/app/source/franchise_data.db
