services:
  router:
    build: .
    container_name: router
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      FLASK_ENV: "production"
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "2", "--timeout", "120", "--max-requests", "500", "--max-requests-jitter", "50", "wsgi_router:app"]

  kona-ml:
    build: .
    container_name: kona-ml
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      FLASK_ENV: "production"
      SECRET_KEY: "FY8hyNv6wCxhboYdS6_Mqc7cj9XVduqYODey2JNorxDvj2ohWReFTTfnYCNauAAb"
      SESSION_COOKIE_SECURE: "true"
    volumes:
      - ./source/franchise_data.db:/app/source/franchise_data.db
