name: Bulk Upload Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bulk upload readiness script
        run: python scripts/bulk_upload_readiness_check.py
