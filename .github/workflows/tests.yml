name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Must track the Dockerfile (python:3.14-slim) -- production runs 3.14,
          # so testing on an older Python tests a stack that is never deployed.
          # It also silently blocks dependency upgrades: releases that declare
          # Requires-Python >=3.12 are uninstallable here and fail as a bogus
          # "No matching distribution found" rather than a real test failure.
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime stack: tests import source.web_app, which loads the ensemble
          # and therefore needs the full inference dependency set.
          pip install -r requirements.txt
          # pytest itself lives in requirements-dev.txt (kept out of the prod
          # image); install it explicitly so this job works whether or not that
          # split has merged yet.
          pip install "pytest>=7.0"

      - name: Run test suite
        run: pytest
