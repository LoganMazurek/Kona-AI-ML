# Static landing page for loganmazurek.com.
#
# Served directly by nginx — there is no longer a `router` application
# container. This removes a ~57 MB gunicorn process from the droplet; the page
# (templates/router.html) is fully static HTML with no server-side rendering.
#
# One-time setup on the droplet (and re-run after editing router.html):
#   sudo mkdir -p /var/www/router
#   sudo cp ~/Kona-AI-ML/templates/router.html /var/www/router/router.html
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name loganmazurek.com www.loganmazurek.com;

    root /var/www/router;

    location / {
        try_files /router.html =404;
    }
}
