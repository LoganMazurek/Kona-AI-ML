<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logan Mazurek - Services Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        
        .header {
            margin-bottom: 50px;
        }
        
        .header h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        
        .service-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        
        .service-card h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .service-card p {
            font-size: 16px;
            opacity: 0.95;
            line-height: 1.5;
        }
        
        .service-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 600px) {
            .services-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .container {
                padding: 40px;
            }
            
            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Logan Mazurek</h1>
            <p>Select a service below</p>
        </div>
        
        <div class="services-grid">
            <a href="https://kona-ml.loganmazurek.com" class="service-card">
                <div class="service-icon">🍧</div>
                <h2>Kona AI/ML</h2>
                <p>Event Revenue Prediction System. Predict revenue for Kona Ice events.</p>
            </a>
            
            <a href="https://nroute.loganmazurek.com" class="service-card">
                <div class="service-icon">📍</div>
                <h2>nRoute</h2>
                <p>Navigation and routing system. Route optimization and planning.</p>
            </a>
        </div>
    </div>
</body>
</html>
