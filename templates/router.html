<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logan Mazurek - Services Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        
        .header {
            margin-bottom: 50px;
        }
        
        .header h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        
        .service-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        
        .service-card h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .service-card p {
            font-size: 16px;
            opacity: 0.95;
            line-height: 1.5;
        }
        
        .service-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .custom-bmc-button {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: #FFDD00;
            border: 2px solid #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 9999;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .custom-bmc-button:hover {
            transform: scale(1.1);
        }

        .router-link {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 9999;
        }

        .router-link:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }
        
        @media (max-width: 600px) {
            .services-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .container {
                padding: 40px;
            }
            
            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <a href="https://loganmazurek.com" class="router-link" title="Back to main router">🚪</a>
    <div class="container">
        <div class="header">
            <h1>Welcome to my online tools!</h1>
            <p>Select a service below</p>
        </div>
        
        <div class="services-grid">
            <a href="https://kona-ml.loganmazurek.com" class="service-card">
                <div class="service-icon">🍧</div>
                <h2>Kona ML</h2>
                <p>Machine learning model. Locally trained on Kona Ice events only.</p>
            </a>
            
            <a href="https://nroute.loganmazurek.com" class="service-card">
                <div class="service-icon">📍</div>
                <h2>Neighborhood Routes</h2>
                <p>Plan out a neighborhood map with options for speed vs coverage.</p>
            </a>
        </div>
    </div>
    <a href="https://www.buymeacoffee.com/loganmazurek" target="_blank" class="custom-bmc-button" title="Buy me a coffee">☕</a>
</body>
</html>
