<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kona AI – Reset Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 460px;
        }

        .card-header { text-align: center; margin-bottom: 28px; }
        .card-header h1 { color: #333; font-size: 24px; margin-bottom: 8px; }
        .card-header p  { color: #666; font-size: 14px; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .links a { color: #667eea; font-weight: 600; text-decoration: none; }
        .links a:hover { text-decoration: underline; }

        .router-link {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            transition: transform 0.2s, background-color 0.2s;
            z-index: 9999;
        }

        .router-link:hover { background: rgba(255,255,255,0.35); transform: translateY(-1px); }
    </style>
</head>
<body>
    <a href="https://loganmazurek.com" class="router-link" title="Back to main router">🚪</a>

    <div class="card">
        <div class="card-header">
            <h1>🔒 Reset Password</h1>
            <p>Choose a new password for your account.</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if not error or token %}
        <form method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required autofocus>
                <p class="hint">Minimum 8 characters.</p>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your new password" required>
            </div>
            <button type="submit" class="btn-primary">Set New Password</button>
        </form>
        {% endif %}

        <div class="links">
            <a href="{{ url_for('login_page') }}">Back to Login</a>
        </div>
    </div>
</body>
</html>
